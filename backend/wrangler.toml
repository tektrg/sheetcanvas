name = "flexsheet-backend"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[vars]
# Comma-separated list of allowed origins. Use "*" only if you understand the risk.
ALLOWED_ORIGINS = "http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173,http://127.0.0.1:3000,https://sheetcanvas.com,https://www.sheetcanvas.com,https://sheetcanvas.pages.dev"
DEFAULT_TIMEOUT_MS = "15000"
MAX_ROWS = "5000"
AGENT_MODEL = "gemini-2.5-flash"
AGENT_DAILY_LIMIT = "50"
# Set ENVIRONMENT="development" in backend/.dev.vars for local agent testing
# without an AGENT_QUOTA KV binding. Production requires KV.
# OAuth client settings for Google Analytics (GA4).
# GOOGLE_CLIENT_ID = "your-client-id"
# GOOGLE_CLIENT_SECRET = "your-client-secret"

# KV namespace for per-session agent quotas. Create with:
#   wrangler kv namespace create AGENT_QUOTA
# then paste the returned id below. Optional locally — quota is fail-open if unbound.
# [[kv_namespaces]]
# binding = "AGENT_QUOTA"
# id = "REPLACE_ME"

# Durable Object relaying MCP tool calls to a live SheetCanvas browser tab.
[[durable_objects.bindings]]
name = "CANVAS_BRIDGE"
class_name = "CanvasBridge"

[[migrations]]
tag = "v1-canvas-bridge"
new_classes = ["CanvasBridge"]

[[d1_databases]]
binding = "DB"
database_name = "flexsheet"
# Use a placeholder UUID for local development; replace with the real DB id for production after `wrangler d1 create`.
database_id = "00000000-0000-0000-0000-000000000000"
