<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height: 100%; }
  body{
    font-family: "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif;
    background: #F2F2F0;
    color: #0E0F0F;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    line-height: 1.4;
  }
  .mono{ font-family: "JetBrains Mono", ui-monospace, monospace; font-feature-settings: "ss02","zero"; letter-spacing: -.01em; }

  html[data-embed="sheet"],
  html[data-embed="sheet"] body{
    background: transparent;
  }

  html[data-embed="sheet"] .app,
  html[data-embed="sheet"] .scrim{
    display: none;
  }

  /* ────────── background app mock ────────── */
  .app{
    position: fixed; inset: 0;
    display: grid;
    grid-template-columns: 56px 1fr;
    background: #F8F7F4;
    filter: saturate(.7);
  }
  .app__rail{
    background: #1A1B1C;
    display: flex; flex-direction: column; align-items: center;
    padding: 14px 0; gap: 6px;
  }
  .app__rail-tab{
    width: 30px; height: 30px; border-radius: 7px;
    background: rgba(244,241,234,.06);
    margin-bottom: 2px;
  }
  .app__rail-tab.is-active{ background: #0d9488; }
  .app__main{
    display: grid; grid-template-rows: 44px 56px 1fr;
    background: #FAFAF7;
  }
  .app__topbar{
    background: #fff; border-bottom: 1px solid #E6E4DD;
    display: flex; align-items: center; padding: 0 18px;
    gap: 10px; font-size: 12px; color: #6B6B68;
  }
  .app__url{ background: #F2F2EF; padding: 5px 12px; border-radius: 7px; flex: 1; max-width: 460px; }
  .app__filterbar{
    background: #fff; border-bottom: 1px solid #E6E4DD;
    display: flex; align-items: center; padding: 0 18px; gap: 10px;
    font-size: 12px; color: #6B6B68;
  }
  .app__pill{ background: #F2F2EF; padding: 6px 12px; border-radius: 6px; }
  .app__pill--teal{ background: #0d9488; color: #fff; }
  .app__sheet{
    background: #fff;
    background-image:
      linear-gradient(to right, rgba(14,15,15,.06) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(14,15,15,.06) 1px, transparent 1px);
    background-size: 110px 28px;
    background-position: -1px -1px;
    position: relative;
  }
  .app__sheet::before{
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 28px;
    background: #F8F7F4;
    border-bottom: 1px solid #E6E4DD;
  }
  .app__sheet::after{
    content: '';
    position: absolute; top: 0; left: 0; bottom: 0; width: 44px;
    background: #F8F7F4;
    border-right: 1px solid #E6E4DD;
  }
  /* dim everything behind the sheet */
  .scrim{
    position: fixed; inset: 0;
    background: rgba(14,15,15,.22);
    backdrop-filter: blur(2px);
    z-index: 10;
  }

  /* ────────── bottom sheet ────────── */
  .sheet{
    position: fixed; left: 50%; bottom: 18px;
    transform: translateX(-50%);
    width: min(1080px, calc(100vw - 36px));
    height: min(640px, calc(100vh - 36px));
    background: #fff;
    border-radius: 18px;
    border: 1px solid rgba(14,15,15,.10);
    box-shadow:
      0 1px 0 rgba(255,255,255,.6) inset,
      0 30px 60px -20px rgba(14,15,15,.32),
      0 12px 24px -12px rgba(14,15,15,.18);
    z-index: 20;
    display: grid;
    grid-template-rows: 56px 1fr 56px;
    overflow: hidden;
    animation: sheetIn .42s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes sheetIn{
    from{ opacity: 0; transform: translate(-50%, 24px); }
    to{ opacity: 1; transform: translate(-50%, 0); }
  }

  /* ── header ── */
  .sheet__hd{
    display: flex; align-items: center; gap: 12px;
    padding: 0 16px 0 14px;
    border-bottom: 1px solid #EBEAE5;
    background: linear-gradient(180deg, #fff, #FBFAF6);
  }
  .sheet__brand{
    width: 32px; height: 32px; border-radius: 8px;
    background: #E6F4F2; color: #0d9488;
    display: grid; place-items: center;
  }
  .sheet__brand svg{ width: 16px; height: 16px; }
  .sheet__title{ font-size: 13.5px; font-weight: 600; letter-spacing: -.005em; }
  .sheet__sub{ font-size: 11.5px; color: #6B6B68; }
  .sheet__hdmeta{ margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .sheet__crumbs{
    display: flex; align-items: center; gap: 6px;
    font-family: "JetBrains Mono", monospace; font-size: 10.5px; color: #8C8D8B;
    padding: 4px 10px; border-radius: 999px; background: #F4F3EE;
  }
  .sheet__crumbs b{ color: #0E0F0F; font-weight: 500; }
  .sheet__close{
    height: 28px; padding: 0 12px; border-radius: 7px;
    background: transparent; border: 1px solid transparent;
    font-size: 12px; color: #6B6B68; cursor: pointer;
    transition: background .15s, color .15s;
  }
  .sheet__close:hover{ background: #F2F2EF; color: #0E0F0F; }

  /* ── body grid ── */
  .sheet__body{
    display: grid;
    grid-template-columns: 220px minmax(0, 1fr) 360px;
    min-height: 0;
  }
  @media (max-width: 920px){
    .sheet__body{ grid-template-columns: 200px minmax(0, 1fr); }
    .sheet__preview{ display: none; }
  }

  /* ── rail ── */
  .rail{
    border-right: 1px solid #EBEAE5;
    padding: 10px 8px;
    overflow-y: auto;
  }
  .rail__group{ padding: 8px 8px 4px; }
  .rail__group-label{
    font-family: "JetBrains Mono", monospace;
    font-size: 9.5px; letter-spacing: .12em;
    color: #8C8D8B; text-transform: uppercase;
  }
  .rail__item{
    display: grid;
    grid-template-columns: 24px 1fr auto;
    align-items: center; gap: 10px;
    padding: 7px 9px;
    border-radius: 8px;
    font-size: 12.5px; color: #2A2B2B;
    cursor: pointer; border: none; background: transparent;
    width: 100%; text-align: left;
    transition: background .12s;
  }
  .rail__item:hover{ background: #F4F3EE; }
  .rail__item.is-active{ background: #0E0F0F; color: #fff; }
  .rail__num{
    font-family: "JetBrains Mono", monospace; font-size: 10px;
    color: #8C8D8B; letter-spacing: -.005em;
  }
  .rail__item.is-active .rail__num{ color: rgba(244,241,234,.55); }
  .rail__icon{
    width: 22px; height: 22px; border-radius: 6px;
    background: #F2F2EF; color: #5B5C5C;
    display: grid; place-items: center;
  }
  .rail__icon svg{ width: 13px; height: 13px; }
  .rail__item.is-active .rail__icon{ background: rgba(244,241,234,.10); color: #fff; }
  .rail__item.is-active .rail__icon svg path,
  .rail__item.is-active .rail__icon svg circle,
  .rail__item.is-active .rail__icon svg rect,
  .rail__item.is-active .rail__icon svg line,
  .rail__item.is-active .rail__icon svg polyline{ stroke: #fff; }
  .rail__name{ font-weight: 500; letter-spacing: -.005em; }
  .rail__check{
    width: 14px; height: 14px; border-radius: 50%;
    border: 1.5px solid #D0CFC8;
  }
  .rail__check.done{ border-color: #0d9488; background: #0d9488; position: relative; }
  .rail__check.done::after{
    content: ''; position: absolute; left: 3px; top: 5px;
    width: 6px; height: 3px;
    border-left: 1.5px solid #fff; border-bottom: 1.5px solid #fff;
    transform: rotate(-45deg);
  }
  .rail__item.is-active .rail__check{ border-color: rgba(244,241,234,.4); }

  /* ── main content ── */
  .main{
    padding: 22px 28px 16px;
    overflow-y: auto;
    min-width: 0;
  }
  .main__top{ display: flex; align-items: flex-start; gap: 14px; margin-bottom: 14px; }
  .main__icon{
    width: 44px; height: 44px; border-radius: 10px;
    background: #0E0F0F; color: #fff;
    display: grid; place-items: center; flex-shrink: 0;
  }
  .main__icon svg{ width: 22px; height: 22px; }
  .main__eyebrow{
    display: inline-flex; align-items: center; gap: 6px;
    font-family: "JetBrains Mono", monospace;
    font-size: 10px; color: #0d9488; letter-spacing: .12em;
    text-transform: uppercase; font-weight: 500;
    margin-bottom: 4px;
  }
  .main__eyebrow .dot{ width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
  .main__title{
    font-size: 26px; line-height: 1.05; font-weight: 500;
    letter-spacing: -.02em; color: #0E0F0F;
  }
  .main__capability{
    font-size: 14.5px; color: #3D3E3E; line-height: 1.5;
    margin-bottom: 18px;
    max-width: 60ch; text-wrap: pretty;
  }

  .main__grid{
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }
  .info-card{
    background: #FAFAF7;
    border: 1px solid #EBEAE5;
    border-radius: 10px;
    padding: 14px 16px;
  }
  .info-card__label{
    font-family: "JetBrains Mono", monospace;
    font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase;
    color: #8C8D8B; margin-bottom: 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .info-card__body{ font-size: 13px; color: #2A2B2B; line-height: 1.5; }

  .kbds{ display: inline-flex; gap: 4px; vertical-align: middle; margin: 0 1px; }
  .kbd{
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 18px; height: 18px;
    padding: 0 5px;
    font-family: "JetBrains Mono", monospace; font-size: 10.5px;
    color: #2A2B2B; background: #fff;
    border: 1px solid #D0CFC8;
    border-radius: 4px;
    box-shadow: 0 1px 0 #D0CFC8;
    line-height: 1;
  }

  .tags{
    display: flex; flex-wrap: wrap; gap: 5px;
    margin-top: 6px;
  }
  .tag{
    font-size: 11px; padding: 3px 8px;
    background: #F2F2EF; color: #3D3E3E;
    border-radius: 999px; border: 1px solid #EBEAE5;
    font-family: "JetBrains Mono", monospace;
    letter-spacing: -.005em;
  }
  .tag--teal{ background: #E6F4F2; color: #0d6b65; border-color: #c5e6e1; }

  .tips{ list-style: none; display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
  .tips li{
    display: flex; align-items: center; gap: 10px;
    font-size: 12.5px; color: #2A2B2B;
  }
  .tips li::before{
    content: '·'; color: #8C8D8B; font-size: 18px; line-height: 0;
  }

  /* ── preview pane ── */
  .sheet__preview{
    background: #FAFAF7;
    border-left: 1px solid #EBEAE5;
    padding: 18px;
    display: flex; flex-direction: column; gap: 12px;
    min-width: 0;
    overflow: hidden;
  }
  .preview__hd{
    display: flex; align-items: center; justify-content: space-between;
    font-family: "JetBrains Mono", monospace;
    font-size: 10px; letter-spacing: .1em;
    color: #8C8D8B; text-transform: uppercase;
  }
  .preview__hd b{ color: #0E0F0F; font-weight: 500; }
  .preview__stage{
    flex: 1; min-height: 0;
    background:
      linear-gradient(to right, rgba(14,15,15,.04) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(14,15,15,.04) 1px, transparent 1px),
      #fff;
    background-size: 24px 24px;
    border: 1px solid #EBEAE5;
    border-radius: 10px;
    position: relative;
    overflow: hidden;
  }
  .preview__caption{
    font-size: 11.5px; color: #6B6B68;
    line-height: 1.5;
    text-wrap: pretty;
  }

  /* ── footer ── */
  .sheet__ft{
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 0 18px;
    border-top: 1px solid #EBEAE5;
    background: linear-gradient(0deg, #FBFAF6, #fff);
    gap: 16px;
  }
  .progress{
    display: flex; gap: 4px; margin-bottom: 6px;
  }
  .progress__seg{
    width: 22px; height: 4px; border-radius: 2px;
    background: #EBEAE5;
    cursor: pointer;
    transition: background .15s;
  }
  .progress__seg:hover{ background: #D0CFC8; }
  .progress__seg.is-done{ background: #0d9488; }
  .progress__seg.is-active{ background: #0E0F0F; width: 32px; }
  .ft__hint{
    font-family: "JetBrains Mono", monospace;
    font-size: 11px; color: #8C8D8B;
    text-align: center;
  }
  .ft__hint b{ color: #0E0F0F; font-weight: 500; }
  .studio-links{
    display: flex; flex-wrap: wrap; gap: 5px 9px;
    font-family: "JetBrains Mono", monospace;
    font-size: 9.5px;
    line-height: 1.2;
  }
  .studio-about{
    margin-bottom: 5px;
    font-size: 10px;
    line-height: 1.25;
    color: #6B6B68;
  }
  .studio-about b{ color: #0E0F0F; font-weight: 500; }
  .studio-links a{
    color: #6B6B68;
    text-decoration: none;
  }
  .studio-links a:hover{ color: #0E0F0F; }
  .ft__nav{ display: flex; justify-content: flex-end; gap: 8px; }
  .nav-btn{
    display: inline-flex; align-items: center; gap: 6px;
    height: 32px; padding: 0 14px;
    border-radius: 8px;
    font-size: 12.5px; font-weight: 500;
    cursor: pointer; border: 1px solid transparent;
    background: transparent; color: #2A2B2B;
    letter-spacing: -.005em;
    transition: background .15s, color .15s, border-color .15s, transform .15s;
  }
  .nav-btn:hover:not(:disabled){ background: #F2F2EF; }
  .nav-btn:disabled{ color: #C7C6BF; cursor: not-allowed; }
  .nav-btn--primary{
    background: #0E0F0F; color: #fff;
  }
  .nav-btn--primary:hover:not(:disabled){ background: #2A2B2B; transform: translateY(-1px); }

  /* ────────── per-step preview internals ────────── */
  /* helpers reused across previews */
  .pv-obj{
    position: absolute;
    background: #fff;
    border: 1px solid rgba(14,15,15,.14);
    border-radius: 8px;
    box-shadow: 0 8px 18px -10px rgba(14,15,15,.18);
    font-size: 10px;
  }
  .pv-obj__hd{
    display: flex; align-items: center; gap: 6px;
    padding: 5px 7px; border-bottom: 1px solid rgba(14,15,15,.06);
  }
  .pv-chip{
    font-family: "JetBrains Mono", monospace;
    font-size: 8.5px; letter-spacing: .08em;
    padding: 2px 5px; border-radius: 3px;
    background: #F2F2EF; color: #5B5C5C;
  }
  .pv-chip--teal{ background: #E6F4F2; color: #0d6b65; }
  .pv-name{ font-size: 10px; color: #2A2B2B; font-weight: 500; }
  .pv-meta{ margin-left: auto; font-family: "JetBrains Mono", monospace; font-size: 9px; color: #8C8D8B; }

  /* —— preview: why —— */
  .pv-why{ display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 14px; height: 100%; }
  .pv-why__pane{
    background: #fff; border: 1px solid rgba(14,15,15,.10);
    border-radius: 8px; padding: 10px;
    display: flex; flex-direction: column; gap: 6px;
    position: relative;
  }
  .pv-why__pane--bad{ background: #FAFAF7; }
  .pv-why__label{
    font-family: "JetBrains Mono", monospace; font-size: 9px;
    color: #8C8D8B; letter-spacing: .08em; text-transform: uppercase;
  }
  .pv-why__pane--good .pv-why__label{ color: #0d9488; }
  .pv-why__title{ font-size: 11px; font-weight: 500; }
  .pv-why__rows{ display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
  .pv-why__rows span{ height: 5px; background: rgba(14,15,15,.06); border-radius: 2px; }
  .pv-why__rows span.hl{ background: #0d9488; }
  .pv-why__pane--bad .pv-why__rows span{ background: rgba(14,15,15,.05); }
  .pv-why__spinner{
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid #E6E4DD; border-top-color: #0E0F0F;
    animation: spin 1s linear infinite;
    margin-top: 6px;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  .pv-why__bar{
    height: 4px; background: rgba(14,15,15,.08); border-radius: 2px; margin-top: auto;
    position: relative; overflow: hidden;
  }
  .pv-why__bar > span{
    position: absolute; left: 0; top: 0; bottom: 0; width: 72%;
    background: #B85B3F; border-radius: 2px;
  }
  .pv-why__pane--good .pv-why__bar > span{ width: 18%; background: #0d9488; }
  .pv-why__ms{ font-family: "JetBrains Mono", monospace; font-size: 9px; color: #5B5C5C; margin-top: 4px; text-align: right; }

  /* —— preview: import —— */
  .pv-imp__file{
    position: absolute; left: 14px; top: 14px;
    background: #fff; border: 1px solid rgba(14,15,15,.14);
    border-radius: 7px; padding: 8px 10px;
    box-shadow: 0 14px 22px -10px rgba(14,15,15,.22);
    transform: rotate(-4deg);
    animation: floatdown 3s ease-in-out infinite;
  }
  @keyframes floatdown{ 0%,100%{ transform: translate(0,0) rotate(-4deg); } 50%{ transform: translate(20px, 28px) rotate(-2deg); } }
  .pv-imp__ext{
    font-family: "JetBrains Mono", monospace; font-size: 8.5px;
    color: #0d6b65; background: #E6F4F2; padding: 2px 5px;
    border-radius: 3px; letter-spacing: .08em;
  }
  .pv-imp__name{ font-size: 10.5px; font-weight: 500; margin-top: 4px; }
  .pv-imp__metab{ font-family: "JetBrains Mono", monospace; font-size: 9px; color: #8C8D8B; }
  .pv-imp__target{
    position: absolute; right: 14px; bottom: 14px;
    width: 140px; height: 86px;
    border: 1.5px dashed #0d9488;
    background: rgba(13,148,136,.06);
    border-radius: 10px;
    display: grid; place-items: center;
    color: #0d6b65;
  }
  .pv-imp__target::before{
    content: ''; position: absolute; inset: -6px;
    border: 1px dashed rgba(13,148,136,.3);
    border-radius: 13px;
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ transform: scale(1); opacity: .8; } 50%{ transform: scale(1.04); opacity: 1; } }
  .pv-imp__target-cnt{ text-align: center; }
  .pv-imp__plus{ font-size: 22px; line-height: 1; color: #0d9488; }
  .pv-imp__target-lbl{ font-family: "JetBrains Mono", monospace; font-size: 9.5px; }
  .pv-imp__arrow{
    position: absolute; left: 70px; top: 60px;
    width: 80px; height: 40px;
    stroke: #0d9488; opacity: .6;
  }

  /* —— preview: command —— */
  .pv-cmd{ padding: 14px; height: 100%; display: flex; flex-direction: column; gap: 8px; }
  .pv-cmd__bar{
    display: flex; align-items: center; gap: 8px;
    background: #0E0F0F; color: #fff;
    border-radius: 8px; padding: 9px 12px;
    font-family: "JetBrains Mono", monospace; font-size: 11px;
  }
  .pv-cmd__bar .ic{ color: #0d9488; }
  .pv-cmd__caret{ display: inline-block; width: 1px; height: 11px; background: #0d9488; vertical-align: middle; margin-left: 1px; animation: blink 1.1s steps(2,end) infinite; }
  @keyframes blink{ 50%{ opacity: 0; } }
  .pv-cmd__bar .esc{ margin-left: auto; font-size: 8.5px; padding: 2px 5px; border-radius: 3px; background: rgba(255,255,255,.1); color: rgba(255,255,255,.6); letter-spacing: .08em; }
  .pv-cmd__list{ display: flex; flex-direction: column; gap: 2px; }
  .pv-cmd__row{
    display: flex; align-items: center; gap: 8px;
    padding: 7px 10px; border-radius: 6px;
    font-family: "JetBrains Mono", monospace; font-size: 10.5px;
    color: #5B5C5C;
  }
  .pv-cmd__row.is-active{
    background: #E6F4F2; color: #0E0F0F;
    border: 1px solid #c5e6e1;
  }
  .pv-cmd__verb{
    font-size: 8.5px; padding: 2px 5px; border-radius: 3px;
    background: #F2F2EF; color: #5B5C5C; letter-spacing: .08em;
  }
  .pv-cmd__row.is-active .pv-cmd__verb{ background: #0d9488; color: #fff; }
  .pv-cmd__row .ret{ margin-left: auto; color: #0d9488; }

  /* —— preview: sort/filter —— */
  .pv-tbl{ padding: 14px; height: 100%; font-family: "JetBrains Mono", monospace; }
  .pv-tbl__row{
    display: grid; grid-template-columns: 1.3fr 1fr 1fr;
    padding: 6px 10px; font-size: 10px;
    border-bottom: 1px solid rgba(14,15,15,.05);
  }
  .pv-tbl__row--hd{ color: #8C8D8B; font-size: 9.5px; background: #FAFAF7; border-radius: 6px 6px 0 0; }
  .pv-tbl__row--hd em{ font-style: normal; color: #0d9488; }
  .pv-tbl__row--hide{ opacity: .25; }
  .pv-tbl__filter{
    margin-top: 10px;
    display: inline-flex; align-items: center; gap: 6px;
    background: #0d9488; color: #fff;
    padding: 4px 10px; border-radius: 999px;
    font-family: "JetBrains Mono", monospace; font-size: 10px;
  }

  /* —— preview: charts —— */
  .pv-ch{ padding: 14px; height: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pv-ch__mini{
    background: #fff; border: 1px solid rgba(14,15,15,.10);
    border-radius: 8px; padding: 10px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .pv-ch__lbl{ font-family: "JetBrains Mono", monospace; font-size: 9px; color: #8C8D8B; letter-spacing: .08em; }
  .pv-ch__mini svg{ width: 100%; height: 38px; }
  .pv-ch__mini rect{ fill: #0E0F0F; opacity: .65; }
  .pv-ch__mini rect.hl{ fill: #0d9488; opacity: 1; }
  .pv-ch__mini polyline{ stroke: #0d9488; }
  .pv-ch__mini circle{ fill: #0E0F0F; opacity: .55; }
  .pv-ch__mini path{ fill: #0d9488; }

  /* —— preview: pivot —— */
  .pv-pv{ padding: 14px; height: 100%; }
  .pv-pv__hd{
    font-family: "JetBrains Mono", monospace; font-size: 9.5px;
    color: #8C8D8B; letter-spacing: .08em;
    display: grid; grid-template-columns: .8fr 1fr 1fr 1fr 1.2fr;
    padding: 4px 0; border-bottom: 1px solid rgba(14,15,15,.1);
  }
  .pv-pv__row{
    font-family: "JetBrains Mono", monospace; font-size: 10.5px;
    display: grid; grid-template-columns: .8fr 1fr 1fr 1fr 1.2fr;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid rgba(14,15,15,.05);
  }
  .pv-pv__row svg{ width: 100%; height: 14px; stroke: #0d9488; fill: none; stroke-width: 1.4; }

  /* —— preview: notes —— */
  .pv-nt{ padding: 14px; height: 100%; position: relative; }
  .pv-nt__chart{
    position: absolute; left: 14px; top: 30px;
    width: 130px; height: 80px;
    background: #fff; border: 1px solid rgba(14,15,15,.12);
    border-radius: 6px; padding: 8px;
  }
  .pv-nt__chart svg{ width: 100%; height: 100%; }
  .pv-nt__chart svg rect{ fill: #0E0F0F; opacity: .65; }
  .pv-nt__chart svg rect.hl{ fill: #0d9488; opacity: 1; }
  .pv-nt__note{
    position: absolute; right: 14px; bottom: 14px;
    width: 150px;
    background: #FFF8DB; border: 1px solid #e9d56e;
    border-radius: 4px; padding: 10px 12px;
    font-size: 10.5px; line-height: 1.4; color: #4a3a06;
    transform: rotate(2deg);
    box-shadow: 0 8px 16px -10px rgba(14,15,15,.2);
  }
  .pv-nt__note span{ display: block; margin-top: 6px; font-size: 9px; color: #8c732a; font-style: italic; }
  .pv-nt__arrow{
    position: absolute; left: 138px; top: 50px;
    width: 80px; height: 50px;
    stroke: #b58a36; opacity: .6; fill: none; stroke-width: 1.2;
  }

  /* —— preview: connect —— */
  .pv-cn{ padding: 14px; height: 100%; position: relative; }
  .pv-cn__src{
    position: absolute;
    background: #fff; border: 1px solid rgba(14,15,15,.12);
    border-radius: 7px; padding: 6px 9px;
    font-size: 10px;
    display: flex; align-items: center; gap: 7px;
  }
  .pv-cn__src .dot{ width: 6px; height: 6px; border-radius: 50%; background: #0d9488; box-shadow: 0 0 0 2px rgba(13,148,136,.2); }
  .pv-cn__src--1{ left: 14px; top: 14px; }
  .pv-cn__src--2{ right: 14px; top: 14px; }
  .pv-cn__src--3{ left: 14px; bottom: 14px; }
  .pv-cn__src--4{ right: 14px; bottom: 14px; }
  .pv-cn__hub{
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 86px; height: 86px; border-radius: 50%;
    background: #0E0F0F; color: #fff;
    display: grid; place-items: center;
    font-family: "JetBrains Mono", monospace; font-size: 9px;
    box-shadow: 0 0 0 8px rgba(14,15,15,.04), 0 0 0 18px rgba(14,15,15,.02);
  }
  .pv-cn__hub b{ display: block; color: #0d9488; font-size: 10.5px; font-weight: 500; letter-spacing: -.005em; }
  .pv-cn__lines{
    position: absolute; inset: 0;
    stroke: #0d9488; stroke-width: 1; stroke-dasharray: 3 4;
    fill: none; opacity: .4;
    animation: dash 4s linear infinite;
  }
  @keyframes dash{ to{ stroke-dashoffset: -100; } }

  /* —— preview: pricing —— */
  .pv-pr{ padding: 14px; height: 100%; display: grid; grid-template-rows: 1fr 1fr; gap: 8px; }
  .pv-pr__tile{
    background: #fff; border: 1px solid rgba(14,15,15,.12);
    border-radius: 8px;
    padding: 12px 14px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .pv-pr__tile--free{ background: #0E0F0F; color: #fff; border-color: #0E0F0F; }
  .pv-pr__tile--soon{ background: #FAFAF7; border-style: dashed; border-color: #c7c6bf; }
  .pv-pr__chip{
    align-self: flex-start;
    font-family: "JetBrains Mono", monospace; font-size: 8.5px;
    letter-spacing: .1em; padding: 2px 7px; border-radius: 999px;
    background: rgba(13,148,136,.16); color: #0d9488;
    border: 1px solid rgba(13,148,136,.3);
  }
  .pv-pr__tile--soon .pv-pr__chip{ background: rgba(14,15,15,.04); color: #5B5C5C; border-color: rgba(14,15,15,.1); }
  .pv-pr__price{ display: flex; align-items: baseline; gap: 6px; }
  .pv-pr__price b{ font-size: 22px; font-weight: 500; letter-spacing: -.02em; line-height: 1; color: #0d9488; }
  .pv-pr__tile--soon .pv-pr__price b{ color: #2A2B2B; }
  .pv-pr__price small{ font-size: 9.5px; opacity: .6; }
  .pv-pr__lbl{ font-size: 11px; font-weight: 500; }
  .pv-pr__tags{ display: flex; flex-wrap: wrap; gap: 4px; }
  .pv-pr__tag{
    font-family: "JetBrains Mono", monospace; font-size: 9px;
    padding: 2px 6px; border-radius: 4px;
    background: rgba(255,255,255,.08); color: rgba(255,255,255,.7);
  }
  .pv-pr__tile--soon .pv-pr__tag{ background: rgba(14,15,15,.05); color: #5B5C5C; }
</style>
</head>
