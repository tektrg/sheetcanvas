    <script>
      /**
       * Tailwind semantic colour aliases.
       * Values come from CSS custom properties defined below in <style>,
       * so a single variable change propagates to every utility class.
       *
       * Usage:  bg-accent  text-accent  border-accent  ring-accent
       *         bg-accent-hover  text-accent-hover
       *         bg-accent-muted  (low-opacity tint for selections / highlights)
       */
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              neutral: {
                850: '#1f1f1f', // Medium contrast dark
              },
              // ── Accent (brand teal) ──────────────────────────────────────
              accent: 'var(--color-accent)',
              'accent-hover': 'var(--color-accent-hover)',
              'accent-muted': 'var(--color-accent-muted)',
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      /* ── Design system tokens ──────────────────────────────────────────
         Keep in sync with theme.ts (the JS mirror).
         All accent colour usage in CSS/Tailwind should read from here.   */
      :root {
        --color-accent:       #0d9488; /* teal-600 */
        --color-accent-hover: #0f766e; /* teal-700 */
        --color-accent-muted: rgba(13, 148, 136, 0.14);
      }
      .dark {
        --color-accent:       #14b8a6; /* teal-500 */
        --color-accent-hover: #0d9488; /* teal-600 */
        --color-accent-muted: rgba(20, 184, 166, 0.2);
      }

      body {
        font-family: 'Inter', sans-serif;
        overflow: hidden; /* Prevent native scroll */
        background-color: #fafafa; /* neutral-50 */
      }
      /* Custom scrollbar for tables */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #d4d4d4; /* neutral-300 */
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #a3a3a3; /* neutral-400 */
      }
      
      .dark body {
        background-color: #171717; /* neutral-900 */
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #525252; /* neutral-600 */
      }
      .dark ::-webkit-scrollbar-thumb:hover {
        background: #737373; /* neutral-500 */
      }

      /* Sheet grid scrollbar: hidden unless hovering the sheet or it is selected */
      .sheet-scroll::-webkit-scrollbar-thumb { background: transparent; }
      .sheet-scroll::-webkit-scrollbar-thumb:hover { background: transparent; }
      .group:hover .sheet-scroll::-webkit-scrollbar-thumb,
      .sheet-scroll-active::-webkit-scrollbar-thumb { background: #d4d4d4; }
      .group:hover .sheet-scroll::-webkit-scrollbar-thumb:hover,
      .sheet-scroll-active::-webkit-scrollbar-thumb:hover { background: #a3a3a3; }
      .dark .group:hover .sheet-scroll::-webkit-scrollbar-thumb,
      .dark .sheet-scroll-active::-webkit-scrollbar-thumb { background: #525252; }
      .dark .group:hover .sheet-scroll::-webkit-scrollbar-thumb:hover,
      .dark .sheet-scroll-active::-webkit-scrollbar-thumb:hover { background: #737373; }

      /* Rich Text Content Styles */
      .rich-text-content ul { list-style-type: disc; margin-left: 1.5rem; }
      .rich-text-content ol { list-style-type: decimal; margin-left: 1.5rem; }
      .rich-text-content b, .rich-text-content strong { font-weight: 600; }
      .rich-text-content i, .rich-text-content em { font-style: italic; }
      .rich-text-content u { text-decoration: underline; }
      .rich-text-content s, .rich-text-content strike { text-decoration: line-through; }
      .rich-text-content blockquote { border-left: 3px solid #d4d4d4; padding-left: 1rem; color: #525252; }
      .dark .rich-text-content blockquote { border-color: #525252; color: #a3a3a3; }
      .rich-text-content h1 { font-size: 1.5em; font-weight: bold; margin-bottom: 0.5em; }
      .rich-text-content h2 { font-size: 1.25em; font-weight: bold; margin-bottom: 0.5em; }

      /* Animation for new nodes */
      @keyframes scaleIn {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }
      .animate-scale-in {
        animation: scaleIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* Animation for delete warning */
      @keyframes pulseSubtle {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(0.99); }
      }
      .animate-delete-pulse {
        animation: pulseSubtle 0.3s ease-in-out;
      }

      /* Data Bar Animation */
      @keyframes scaleInX {
        from { transform: scaleX(0); }
        to { transform: scaleX(1); }
      }
      .animate-scale-in-x {
        animation: scaleInX 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* Cell Flash Animation for Updates */
      @keyframes cellFlash {
        0% { background-color: var(--color-accent-muted); }
        100% { background-color: transparent; }
      }
      .animate-cell-flash {
        animation: cellFlash 0.6s ease-out;
      }
      
      /* Number Pop Animation */
      @keyframes popIn {
        0% { transform: scale(0.8); opacity: 0; }
        50% { transform: scale(1.1); }
        100% { transform: scale(1); opacity: 1; }
      }
      .animate-pop-in {
        animation: popIn 0.2s ease-out forwards;
      }
    </style>
