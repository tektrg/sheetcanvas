    <meta charset="UTF-8" />

    <title>Infinite Calc Canvas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              neutral: {
                850: '#1f1f1f', // Medium contrast dark
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        overflow: hidden; /* Prevent native scroll */
        background-color: #fafafa; /* neutral-50 */
      }
      /* Custom scrollbar for tables */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #d4d4d4; /* neutral-300 */
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #a3a3a3; /* neutral-400 */
      }
      
      .dark body {
        background-color: #171717; /* neutral-900 */
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #525252; /* neutral-600 */
      }
      .dark ::-webkit-scrollbar-thumb:hover {
        background: #737373; /* neutral-500 */
      }
    </style>
