<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Infinite Calc Canvas</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              neutral: {
                850: '#1f1f1f', // Medium contrast dark
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        overflow: hidden; /* Prevent native scroll */
        background-color: #fafafa; /* neutral-50 */
      }
      /* Custom scrollbar for tables */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #d4d4d4; /* neutral-300 */
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #a3a3a3; /* neutral-400 */
      }
      
      .dark body {
        background-color: #171717; /* neutral-900 */
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #525252; /* neutral-600 */
      }
      .dark ::-webkit-scrollbar-thumb:hover {
        background: #737373; /* neutral-500 */
      }

      /* Rich Text Content Styles */
      .rich-text-content ul { list-style-type: disc; margin-left: 1.5rem; }
      .rich-text-content ol { list-style-type: decimal; margin-left: 1.5rem; }
      .rich-text-content b, .rich-text-content strong { font-weight: 600; }
      .rich-text-content i, .rich-text-content em { font-style: italic; }
      .rich-text-content u { text-decoration: underline; }
      .rich-text-content s, .rich-text-content strike { text-decoration: line-through; }
      .rich-text-content blockquote { border-left: 3px solid #d4d4d4; padding-left: 1rem; color: #525252; }
      .dark .rich-text-content blockquote { border-color: #525252; color: #a3a3a3; }
      .rich-text-content h1 { font-size: 1.5em; font-weight: bold; margin-bottom: 0.5em; }
      .rich-text-content h2 { font-size: 1.25em; font-weight: bold; margin-bottom: 0.5em; }

      /* Animation for new nodes */
      @keyframes scaleIn {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }
      .animate-scale-in {
        animation: scaleIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* Animation for delete warning */
      @keyframes pulseSubtle {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(0.99); }
      }
      .animate-delete-pulse {
        animation: pulseSubtle 0.3s ease-in-out;
      }

      /* Data Bar Animation */
      @keyframes scaleInX {
        from { transform: scaleX(0); }
        to { transform: scaleX(1); }
      }
      .animate-scale-in-x {
        animation: scaleInX 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* Cell Flash Animation for Updates */
      @keyframes cellFlash {
        0% { background-color: rgba(20, 184, 166, 0.3); } /* teal-500 @ 30% */
        100% { background-color: transparent; }
      }
      .animate-cell-flash {
        animation: cellFlash 0.6s ease-out;
      }
      
      /* Number Pop Animation */
      @keyframes popIn {
        0% { transform: scale(0.8); opacity: 0; }
        50% { transform: scale(1.1); }
        100% { transform: scale(1); opacity: 1; }
      }
      .animate-pop-in {
        animation: popIn 0.2s ease-out forwards;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom": "https://aistudiocdn.com/react-dom@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "recharts": "https://esm.sh/recharts@2.15.0?external=react,react-dom",
    "html2canvas": "https://esm.sh/html2canvas@1.4.1",
    "markdown-to-jsx": "https://aistudiocdn.com/markdown-to-jsx@^9.1.1",
    "idb": "https://esm.sh/idb@8.0.0",
    "xlsx": "https://esm.sh/xlsx@0.18.5",
    "d3-format": "https://esm.sh/d3-format@3.1.0",
    "@tanstack/react-virtual": "https://esm.sh/@tanstack/react-virtual@3.5.0?external=react,react-dom",
    "zustand": "https://esm.sh/zustand@4.5.0?external=react",
    "zustand/middleware": "https://esm.sh/zustand@4.5.0/middleware?external=react"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
